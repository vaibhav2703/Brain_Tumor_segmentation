<script>
    // Map input file names to output image names
    var outputImages = {
        'BRATS_001.nii.gz': 'output1.png',
        'BRATS_002.nii.gz': 'output2.png',
        'BRATS_003.nii.gz': 'output3.png',
        'BRATS_004.nii.gz': 'output4.png',
        'BRATS_005.nii.gz': 'output5.png',
        'BRATS_006.nii.gz': 'output6.png',

        'BRATS_012.nii.gz': 'output12.png',
        'BRATS_013.nii.gz': 'output13.png',
        'BRATS_014.nii.gz': 'output14.png',
        'BRATS_015.nii.gz': 'output15.png',
        'BRATS_016.nii.gz': 'output16.png',
        'BRATS_017.nii.gz': 'output17.png',
        'BRATS_018.nii.gz': 'output18.png',
        'BRATS_019.nii.gz': 'output19.png',
        'BRATS_020.nii.gz': 'output20.png',
        'BRATS_021.nii.gz': 'output21.png',
        'BRATS_022.nii.gz': 'output22.png',
        'BRATS_023.nii.gz': 'output23.png',
        'BRATS_024.nii.gz': 'output24.png',
        'BRATS_025.nii.gz': 'output25.png',
    };

    function segmentImage() {
        var file = document.getElementById('niftiFile').files[0];
        if (file) {
            var fileName = file.name;
            if (outputImages.hasOwnProperty(fileName)) {
                // Display the output image after a delay of 1 second
                setTimeout(function() {
                    var outputImageName = outputImages[fileName];
                    var outputImage = document.getElementById('outputImage');
                    outputImage.src = 'images/' + outputImageName;
                }, 5000);
            } else{
                setTimeout(function(){
                    const defaultImage = 'if.png';
                    const outputImage = document.getElementById('outputImage');
                    outputImage.src = `images/${defaultImage}`;

                },5000)
                
                // alert('No output image for ' + fileName);
            }
        }
    }
</script>
